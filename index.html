<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header class="card-header">
      <h1>待辦清單</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
        <span id="theme-toggle-icon" aria-hidden="true">🌙</span>
        <span id="theme-toggle-label">深色模式</span>
      </button>
    </header>

    <!-- 新增待辦事項的輸入區 -->
    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
      />
      <button type="submit">新增</button>
    </form>

    <!-- 篩選待辦事項的狀態按鈕 -->
    <div class="filter-bar" role="group" aria-label="待辦事項篩選">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">未完成</button>
      <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦事項清單 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 清單為空時顯示的提示文字 -->
    <p id="empty-message" class="empty-message">還沒有任何待辦事項,新增一個吧!</p>

    <!-- 底部顯示未完成的項目數量 -->
    <footer class="todo-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
